version: "3"

services:
  portfolio-app: # サービス名
    container_name: portfolio-container
    build: .
    volumes: #バインドマウント
      - ./:/usr/src/app
      - ./node_modules:/app/node_modules
    command: npm run dev
    env_file:
      - .env.local
    ports:
      - "3030:5173"
volumes:
  node_modules:
